CONFIG_LOG=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
# Remote wakeup: the config descriptor carries the remote-wakeup attribute so
# the host knows the device can wake the bus. The host still must explicitly
# arm it (SET_FEATURE(DEVICE_REMOTE_WAKEUP)) before usbd_wakeup_request()
# succeeds, otherwise it returns -EACCES.
CONFIG_SAMPLE_USBD_REMOTE_WAKEUP=y
CONFIG_INPUT=y

# DFU: the run-time instance is registered next to the HID interface, the DFU
# mode instance ("dfu_dfu") is blocklisted by the common sample code and only
# registered by switch_to_dfu_mode(). The built-in flash backend is left off,
# src/dfu_slots.c drives the two partitions through flash_area_* instead.
CONFIG_USBD_DFU=y
CONFIG_USBD_DFU_NUMOF_IMAGES=2
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# switch_to_dfu_mode() runs on the system workqueue (cooperative priority) and
# tears USB down there, which starves the deferred log thread.
CONFIG_LOG_MODE_IMMEDIATE=y

# In immediate mode the whole formatting chain runs inline on the calling
# thread, and z_log_msg_runtime_vcreate() alloca()s the packaged message there,
# so a single log call needs ~1K of stack. The DWC2 driver thread logs from its
# per-transfer path (dwc2_prep_rx(), dwc2_set_dedicated_fifo()), which is more
# than the 512 byte default stack can absorb. Drop those to WRN (as the other
# USB samples do) and give the driver thread room for the WRN/ERR calls that
# remain.
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DWC2_STACK_SIZE=1024
