CONFIG_LOG=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
# Remote wakeup: the config descriptor carries the remote-wakeup attribute so
# the host knows the device can wake the bus. The host still must explicitly
# arm it (SET_FEATURE(DEVICE_REMOTE_WAKEUP)) before usbd_wakeup_request()
# succeeds, otherwise it returns -EACCES.
CONFIG_SAMPLE_USBD_REMOTE_WAKEUP=y
CONFIG_INPUT=y
