CONFIG_BEE_INPUT_KEYSCAN_AUTOSCAN_MODE=y
# In auto scan mode the keyscan driver reports its events from the ISR with
# K_FOREVER. Through the input thread a full queue then pends whatever thread
# the ISR interrupted, and the input thread runs at the lowest priority, so at
# the 8 kHz report rate it falls behind and the queue does fill up. Run the
# callbacks right in the reporting context instead, they only update a few
# variables.
CONFIG_INPUT_MODE_SYNCHRONOUS=y
