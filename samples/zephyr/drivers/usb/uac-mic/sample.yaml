sample:
  name: USB audio microphone sample
tests:
  sample.usb.audio.uac_mic:
    depends_on: usb_device
    tags: usb
    arch_exclude: posix
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Entered main"
        - "Found USB Microphone Device"
        - "USB enabled"
