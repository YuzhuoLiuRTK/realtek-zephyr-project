CONFIG_STDOUT_CONSOLE=y

#USB related configs
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr USB audio mic sample"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

#LOG subsystem related configs
CONFIG_LOG=y
CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y

#net buf options
CONFIG_NET_BUF=y

#USB audio related configs
CONFIG_USB_DEVICE_AUDIO=y
CONFIG_USB_DEVICE_AUDIO_SAMPLE_RATE=48000

#I2S and codec configs (for MIC capture)
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_I2S_RTL87X2G_RX=y
CONFIG_HEAP_MEM_POOL_SIZE=1024
